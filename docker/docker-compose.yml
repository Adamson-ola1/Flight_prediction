# Run from the project root:
#   docker compose -f docker/docker-compose.yml up --build
services:
  backend:
    build:
      context: ..
      dockerfile: dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ../models:/app/models
      - ../outputs:/app/outputs
    environment:
      PYTHONUNBUFFERED: "1"

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - backend
