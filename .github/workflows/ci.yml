name: Flight Prediction CI/CD


# ==========================================================
# Workflow Triggers
# ==========================================================

on:

  push:
    branches:
      - main

  pull_request:
    branches:
      - main


# ==========================================================
# Permissions
# ==========================================================

permissions:

  contents: read

  packages: write


# ==========================================================
# Jobs
# ==========================================================

jobs:


  # ========================================================
  # Backend / ML Validation
  # ========================================================

  backend:

    name: Backend and ML Validation

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.11"
          cache: pip


      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      - name: Validate Python
        run: |
          python -m compileall backend src


      - name: Lint
        run: |
          pip install flake8
          flake8 src backend config.py main.py \
            --max-line-length=110 \
            --extend-ignore=E203,W503 || true


      - name: Train and evaluate pipeline
        run: |
          python main.py


      - name: Run tests
        run: |
          pytest -v


      - name: Upload trained artifacts
        uses: actions/upload-artifact@v4

        with:
          name: ml-artifacts

          path: |
            models/
            outputs/

          if-no-files-found: error

          retention-days: 7


  # ========================================================
  # Frontend
  # ========================================================

  frontend:

    name: Frontend Build

    runs-on: ubuntu-latest

    defaults:

      run:
        working-directory: frontend

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup Node.js
        uses: actions/setup-node@v4

        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json


      - name: Install dependencies
        run: |
          npm ci


      - name: Build frontend
        run: |
          npm run build


  # ========================================================
  # Docker Images
  # ========================================================

  docker:

    name: Build and Push Docker Images

    runs-on: ubuntu-latest

    needs:
      - backend
      - frontend

    steps:

      # ----------------------------------------------------
      # Checkout
      # ----------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # ----------------------------------------------------
      # Download trained ML artifacts
      # ----------------------------------------------------

      - name: Download ML artifacts
        uses: actions/download-artifact@v4

        with:
          name: ml-artifacts
          path: .


      # ----------------------------------------------------
      # Login to GitHub Container Registry
      # ----------------------------------------------------

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3

        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      # ----------------------------------------------------
      # Convert repository name to lowercase
      # ----------------------------------------------------

      - name: Convert repository name to lowercase
        id: repo

        run: |
          echo "repository=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"


      # ====================================================
      # Backend API Docker Image
      # ====================================================

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v6

        with:
          context: .
          file: ./Dockerfile
          push: true

          tags: |
            ghcr.io/${{ steps.repo.outputs.repository }}-api:latest
            ghcr.io/${{ steps.repo.outputs.repository }}-api:${{ github.sha }}


      # ====================================================
      # Frontend Docker Image
      # ====================================================

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v6

        with:
          context: .
          file: ./frontend/Dockerfile
          push: true

          tags: |
            ghcr.io/${{ steps.repo.outputs.repository }}-frontend:latest
            ghcr.io/${{ steps.repo.outputs.repository }}-frontend:${{ github.sha }}

